name: Validate and publish Banco de Mana
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: banco-mana-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - run: python3 docs/build-preview.py
      - run: python3 docs/build-release.py --repository "$GITHUB_REPOSITORY"
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node docs/test-preview.mjs
      - run: node docs/test-native.mjs
      - name: Publish versioned Foundry release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag; increment module.json for the next release."
            exit 0
          fi
          gh release create "$tag" dist/module.json dist/module.zip dist/Banco-Mana-Preview.html dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Banco de Mana $version" --notes-file dist/release-notes.md --latest
